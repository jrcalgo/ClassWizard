server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Audits are PDFs; leave headroom over typical DegreeWorks exports.
    client_max_body_size 25m;

    # Note: add_header inside a location replaces these, so each location that
    # sets its own headers repeats them.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # API: strip the /api prefix. /explain can take EXPLAIN_TIMEOUT (180 s by
    # default) on CPU, so allow longer than that before nginx gives up.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        # $http_host keeps the port, so the backend's same-origin check matches
        # the browser's Origin header.
        proxy_set_header Host $http_host;
        # Overwrite (not append) so clients cannot spoof the address recorded
        # in the activity log and used for rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed build assets never change, so cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths (/login, /account, ...) load index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }
}
