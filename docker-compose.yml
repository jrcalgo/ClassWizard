services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classwizard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classwizard}
      POSTGRES_DB: ${POSTGRES_DB:-classwizard}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1 FROM pg_extension WHERE extname = ''vector''" | grep -q 1',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--bind",
        "0.0.0.0",
        "--protected-mode",
        "no",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Local language model for /explain. Not published to the host: the backend
  # reaches it at http://ollama:11434 on the compose network. Models are kept
  # in the "ollama" volume, so the download happens only once.
  # GPU: add -f docker-compose.gpu.yml. Already running Ollama on the host:
  # see "Use Ollama on your own machine" in DEPLOYMENT.md.
  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-time job: pulls the EXPLAIN_MODEL model (prefix removed), then exits.
  # Instant when the model is already in the volume.
  ollama-pull:
    image: ollama/ollama:0.40.16
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      EXPLAIN_MODEL: ${EXPLAIN_MODEL:-ollama_chat/qwen3:8b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'model="$${EXPLAIN_MODEL#ollama_chat/}"; model="$${model#ollama/}"; echo "Pulling $$model"; exec ollama pull "$$model"'
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # The first boot loads and embeds everything (15-20+ minutes on some machines),
    # so allow a long start before a failing check counts as unhealthy.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()==b'OK'"]
      interval: 10s
      timeout: 5s
      start_period: 45m
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Starts the model download alongside the backend instead of waiting for
      # it (several GB on first run), so recommendations work right away and
      # /explain answers once the pull finishes. required: false lets
      # "--scale ollama=0 --scale ollama-pull=0" skip the bundled Ollama.
      ollama-pull:
        condition: service_started
        required: false
      mailpit:
        condition: service_started
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classwizard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classwizard}
      POSTGRES_DB: ${POSTGRES_DB:-classwizard}
      DATABASE_URL: postgresql://${POSTGRES_USER:-classwizard}:${POSTGRES_PASSWORD:-classwizard}@postgres:5432/${POSTGRES_DB:-classwizard}
      # Lets `docker compose exec backend psql -h postgres ...` connect without a prompt
      PGPASSWORD: ${POSTGRES_PASSWORD:-classwizard}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LLM_MODE: ${LLM_MODE:-api}
      LLM_SUBSCRIPTION: ${LLM_SUBSCRIPTION:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      CHATGPT_TOKEN_DIR: /opt/codex
      CHATGPT_AUTH_FILE: auth.json
      GITHUB_COPILOT_TOKEN_DIR: /opt/copilot-token
      # /explain: local Ollama only (separate from LLM_MODEL, which /chat uses)
      EXPLAIN_MODEL: ${EXPLAIN_MODEL:-ollama_chat/qwen3:8b}
      # Bundled container by default; http://host.docker.internal:11434 uses Ollama on the host
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      # Seconds per answer; CPU-only qwen3:8b can be slow. Keep below the frontend's 240s.
      EXPLAIN_TIMEOUT: ${EXPLAIN_TIMEOUT:-180}
      # qwen3 "thinking" is off by default: ~5x faster on CPU, and the reasoning is discarded anyway
      EXPLAIN_THINK: ${EXPLAIN_THINK:-false}
      # Seconds an uploaded audit survives without the page renewing it; must exceed EXPLAIN_TIMEOUT
      AUDIT_TTL_SECONDS: ${AUDIT_TTL_SECONDS:-600}
      # 1 lets /explain use a hosted EXPLAIN_MODEL (e.g. OpenRouter); off by default
      EXPLAIN_ALLOW_REMOTE: ${EXPLAIN_ALLOW_REMOTE:-0}
      # ai.recommendations.spark_jobs: Parquet lake path and Spark driver memory
      LAKE_DIR: /data/lake
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      # explain = cited answers via /explain (local Ollama); chat = syllabus chat via /chat.
      # Served to the frontend by GET /config.
      CHAT_MODE: ${CHAT_MODE:-explain}
      # Course concept maps (GET /concept-maps)
      SYLLAB_MAP_DIR: /data/syllabCMap
      # Accounts. PUBLIC_BASE_URL is the address users open (cookies, email
      # links, Google redirect URI, CSRF origin check).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8501}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Fernet key(s) encrypting saved audits; empty disables saving audits.
      AUDIT_ENCRYPTION_KEY: ${AUDIT_ENCRYPTION_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Defaults deliver to the bundled Mailpit container.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ClassWizard <no-reply@classwizard.local>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-0}
      SMTP_SSL: ${SMTP_SSL:-0}
    extra_hosts:
      # Lets Linux Docker resolve host.docker.internal (Docker Desktop already does)
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
      # Spark UI while ai.recommendations.spark_jobs runs
      - "${SPARK_UI_PORT:-4041}:4040"
    volumes:
      # Drop graduate-catalog-YYYY-YYYY.zip next to the undergraduate zip to
      # load both catalogs.
      - ${CATALOG_DATASET_DIR:-./data/_datasets/uncc-courses/catalog/dataset}:/data/dataset:ro
      - ./data/_datasets/onet:/data/onet:ro
      - ./data/catalog_out:/data/out
      - ./data/uncc-courses/syllabi:/data/syllabi:ro
      - ./data/_datasets/uncc-courses/syllabi:/data/syllabus_records:ro
      # Parquet tables written by ai.recommendations.spark_jobs
      - ./data/lake:/data/lake
      - ./data/syllabCMap:/data/syllabCMap:ro
      - ${CLAUDE_HOME:-${HOME}/.claude}:/opt/claude:ro
      - ${CODEX_HOME:-${HOME}/.codex}:/opt/codex
      - ${GITHUB_COPILOT_TOKEN_DIR:-./data/copilot-token}:/opt/copilot-token

  # React + TypeScript app (new_frontend/), built by Vite and served by nginx,
  # which also proxies /api/* to the backend. The Streamlit MVP in frontend/
  # is no longer started.
  frontend:
    build:
      context: ./new_frontend
      dockerfile: Dockerfile
    # Wait for the API, so the page never loads before the backend can answer.
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8501}:80"

  # Development mail catcher for verification and password-reset emails.
  # Inbox: http://localhost:8025. In production, point SMTP_* at a real server
  # and skip it with --scale mailpit=0.
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
  ollama:
