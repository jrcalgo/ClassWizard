name: classwizard-v3
x-app: &app
  build: ./backend
  image: classwizard-v3-api
  environment: &environment
    ATTEMPT: v3
    PYTHONPATH: /app
    DATABASE_URL: postgresql+psycopg://wizard:wizard@postgres:5432/wizard
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /data
    EMBEDDING_URL: http://embeddings:8000
    OLLAMA_URL: http://ollama:11434
    OLLAMA_MODEL: qwen2.5:3b
  volumes:
    - ./data:/data:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  mem_limit: 768m
  cpus: 1
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: wizard
      POSTGRES_USER: wizard
      POSTGRES_PASSWORD: wizard
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wizard"]
      interval: 3s
      retries: 30
    mem_limit: 1g
    cpus: 0.95
  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 192mb, --maxmemory-policy, noeviction]
    tmpfs: [/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      retries: 30
    mem_limit: 256m
    cpus: 0.1
  init:
    <<: *app
    command: [sh, -c, "python -m alembic upgrade head && python -m classwizard.ingest"]
  api:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      retries: 30
  worker:
    <<: *app
    command: [python, -m, classwizard.worker]
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    depends_on:
      init:
        condition: service_completed_successfully
  embedder:
    <<: *app
    command: [python, -m, classwizard.embedding_worker]
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    depends_on:
      init:
        condition: service_completed_successfully
  web:
    build: ./frontend
    ports: ["127.0.0.1:8083:80"]
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.15
  source-checker:
    <<: *app
    command: [python, -m, classwizard.source_checks, --loop]
    cpus: 0.05
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
  embeddings:
    build:
      context: ./backend
      dockerfile: Dockerfile.embeddings
    volumes: ["models:/models"]
    mem_limit: 2g
    cpus: 1
  ollama:
    image: ollama/ollama:0.6.8@sha256:50ab2378567a62b811a2967759dd91f254864c3495cbe50576bd8a85bc6edd56
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes: ["ollama:/root/.ollama"]
    mem_limit: 3g
    cpus: 2
  pull-model:
    image: curlimages/curl:8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
    depends_on: [ollama]
    restart: on-failure
    command: ["-f", "--retry", "15", "--retry-connrefused", "--retry-delay", "2", "http://ollama:11434/api/pull", "-d", "{\"name\":\"qwen2.5:3b\"}"]
  tests:
    <<: *app
    profiles: [tools]
    environment:
      <<: *environment
      INTEGRATION: '1'
    volumes:
      - ./backend:/app:ro
      - ./data:/data:ro
      - ./frontend/public/demo-state.json:/demo-state.json:ro
      - ./docs:/reports
    command: [python, -m, pytest, tests, -q, -p, no:cacheprovider]
    depends_on:
      init:
        condition: service_completed_successfully
volumes:
  postgres:
  models:
  ollama:
