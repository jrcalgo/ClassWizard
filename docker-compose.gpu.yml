# Optional: run the bundled Ollama on NVIDIA GPUs.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Needs an NVIDIA driver plus the NVIDIA Container Toolkit (Linux) or
# Docker Desktop with the WSL 2 backend (Windows).
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
