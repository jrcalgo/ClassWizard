  #     db:
  #       condition: service_healthy
  #
  # frontend:
  #   build: ./app/frontend
  #   environment:
  #     BACKEND_URL: http://backend:8000
  #   ports:
  #     - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"
  #   depends_on:
  #     - backend
  #
  # db-loader:            # catalog JSON -> Postgres (the README's "layer D")
  #   profiles: ["pipelines"]
  #   build: ...
  #   environment: *db-client-env
  #   volumes:
  #     - ./data/catalog_out:/data/in:ro
  #   depends_on:
