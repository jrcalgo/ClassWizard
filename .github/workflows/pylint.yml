name: ClassWizard MVP validation
on: [push, pull_request]
jobs:
  final-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: attempts/v3/frontend/package-lock.json
      - name: Prepare and validate real-service backend
        working-directory: attempts/v3
        run: |
          python3 tools/prepare.py
          docker compose build api web
          docker compose up -d postgres redis
          docker compose run --rm init
          docker compose run --rm --no-deps tests
          docker compose up -d api web
      - name: Validate frontend and browser workflow
        working-directory: attempts/v3/frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm test
      - name: Stop isolated services
        if: always()
        working-directory: attempts/v3
        run: docker compose down
